# this is only an EXAMPLE of deploying Masdoor in kubernetes
# please modify this file according to your requirements
apiVersion: v1
kind: Service
metadata:
  #EDIT IT: if you don't want to run masdoor in default namespace, please modify this field
  #namespace: masdoor
  name: masdoor-svc
  labels:
    app: masdoor
spec:
  #EDIT IT: if you don't want to run masdoor in default namespace, please modify this filed
  type: NodePort
  ports:
    - port: 8000
  selector:
    app: masdoor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  #EDIT IT: if you don't want to run masdoor in default namespace, please modify this field
  #namespace: masdoor
  name: masdoor-deployment
  labels:
    app: masdoor
spec:
  #EDIT IT: if you don't use redis, masdoor should not have multiple replicas
  replicas: 1
  selector:
    matchLabels:
      app: masdoor
  template:
    metadata:
      labels:
        app: masdoor
    spec:
      containers:
        - name: masdoor-container
          image: mahoo12138/masdoor:latest  # EDIT IT: build your own image or use this fork's registry
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            # the mounted directory path in THE CONTAINER
            - mountPath: /conf
              name: conf
          env:       
            - name: RUNNING_IN_DOCKER
              value: "true"
      #if you want to deploy this in real prod env, consider the config map
      volumes:
        - name: conf
          hostPath:
            #EDIT IT: the mounted directory path in THE HOST
            path: /conf
