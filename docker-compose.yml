services:
  masdoor:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      # Uncomment to override the image's production conf/app.conf:
      # - ./conf/app.conf:/conf/app.conf:ro
      - masdoor-data:/data

volumes:
  masdoor-data:
