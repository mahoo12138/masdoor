services:
  masdoor:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    entrypoint: /bin/sh -c './server --createDatabase=true'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./conf:/conf/
      - masdoor-data:/data

volumes:
  masdoor-data:
