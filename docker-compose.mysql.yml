# MySQL overlay — use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up --build
services:
  masdoor:
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器内必须通过 compose 服务名访问 MySQL（conf/app.conf 里的 localhost 指向容器自身）
      driverName: mysql
      dataSourceName: "root:123456@tcp(db:3306)/"
      dbName: masdoor

  db:
    restart: unless-stopped
    image: mysql:8.0
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  mysql-data:
